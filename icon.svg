<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#05121e" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Subtle grid / geometric rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#14b8a6" stroke-opacity="0.12" stroke-width="2" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#06b6d4" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="8 8" />

  <!-- Gesture Hand & "X" Stylized Symbol -->
  <g filter="url(#glow)">
    <!-- Right angled gesture stroke of X -->
    <path d="M168 152 L344 360" stroke="url(#primaryGrad)" stroke-width="36" stroke-linecap="round" />
    <!-- Cross angled gesture stroke with hand wave curve -->
    <path d="M344 152 L276 232" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" />
    <path d="M236 280 L168 360" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" />
    
    <!-- Central pulse node -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
    
    <!-- Stylized 3 gesture wave dots -->
    <circle cx="372" cy="180" r="10" fill="#38bdf8" />
    <circle cx="396" cy="216" r="8" fill="#2dd4bf" />
    <circle cx="406" cy="256" r="6" fill="#10b981" />
  </g>

  <!-- Text Label -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="4" fill="#ffffff">GESTURE<tspan fill="#14b8a6">X</tspan></text>
</svg>
